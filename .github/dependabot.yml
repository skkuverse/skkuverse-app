# Keeps the SHA-pinned actions current: one grouped pull request a month for
# every `uses:` in .github/workflows/, each pin rewritten with its new version
# comment. npm is left out on purpose: dependencies are bumped one package per
# change by hand (CLAUDE.md). A release is offered only once it is seven days
# old, so a compromised version pulled upstream within days never reaches a
# pull request. scripts/workflow-pins.test.mjs pins this file and the SHA pins
# it maintains.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
